
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RISE NETWORK | Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b14;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.box{
  width:100%;
  max-width:420px;
  background:#111827;
  border:1px solid #273449;
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 60px #0008
}
h1{text-align:center;margin:0 0 6px}
p{text-align:center;color:#9ca3af}
input{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:1px solid #374151;
  border-radius:10px;
  background:#080b14;
  color:white;
  font-size:16px
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#5865f2;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer
}
#msg{
  margin-top:15px;
  color:#f87171;
  text-align:center
}
.dashboard{display:none}
.card{
  background:#111827;
  border:1px solid #273449;
  border-radius:18px;
  padding:25px;
  width:100%;
  max-width:700px
}
.stat{
  padding:20px;
  margin-top:15px;
  background:#0b1220;
  border-radius:12px
}
.logout{background:#ef4444}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h1>RISE NETWORK</h1>
  <p>Admin Panel</p>

  <input
    type="password"
    id="password"
    placeholder="Admin Password"
  >

  <button onclick="login()">LOGIN</button>

  <div id="msg"></div>
</div>

<div class="dashboard" id="dashboard">
  <div class="card">
    <h1>RISE NETWORK</h1>
    <p>Admin Dashboard</p>

    <div class="stat">
      <h2>🛠️ Admin Panel</h2>
      <p>You are successfully logged in.</p>
    </div>

    <div class="stat">
      <h3>Server</h3>
      <p>risesmp.online</p>
    </div>

    <div class="stat">
      <h3>Gamemodes</h3>
      <p>Survival SMP • BedWars</p>
    </div>

    <button class="logout" onclick="logout()">LOGOUT</button>
  </div>
</div>

<script>
async function login(){

  const password =
    document.getElementById("password").value;

  if(!password){
    document.getElementById("msg").textContent =
      "Enter your password";
    return;
  }

  try{

    const response = await fetch("/api/admin/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({password})
    });

    const data = await response.json();

    if(data.success){

      sessionStorage.setItem("riseAdmin","true");

      document.getElementById("loginBox").style.display="none";
      document.getElementById("dashboard").style.display="block";

    }else{

      document.getElementById("msg").textContent =
        "Wrong password!";
    }

  }catch(error){

    document.getElementById("msg").textContent =
      "Server connection error!";
  }
}

function logout(){
  sessionStorage.removeItem("riseAdmin");
  location.reload();
}

if(sessionStorage.getItem("riseAdmin")==="true"){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
