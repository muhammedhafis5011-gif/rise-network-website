<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RISE NETWORK — Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b14;
  color:#fff;
}

.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  background:#111827;
  border:1px solid #29334a;
  border-radius:22px;
  padding:30px;
  width:100%;
  max-width:450px;
}

.logo{
  width:70px;
  height:70px;
  margin:0 auto 20px;
  border-radius:20px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
}

h1{
  text-align:center;
  margin:0;
}

.sub{
  text-align:center;
  color:#9299b5;
  margin:8px 0 28px;
}

input,
textarea{
  width:100%;
  padding:14px;
  margin-top:7px;
  border-radius:11px;
  border:1px solid #374151;
  background:#080b14;
  color:white;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 18px;
  background:#5865f2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.login button{
  width:100%;
  margin-top:16px;
}

#message{
  text-align:center;
  margin-top:14px;
  color:#ff7b7b;
}

.panel{
  max-width:1000px;
  margin:auto;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topbar h1{
  text-align:left;
}

.logout{
  background:#ef4444;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

.box{
  background:#111827;
  border:1px solid #29334a;
  border-radius:18px;
  padding:22px;
}

.box h2{
  margin-top:0;
}

.announcement{
  background:#080b14;
  border:1px solid #29334a;
  border-radius:14px;
  padding:18px;
  margin-top:12px;
}

.announcement h3{
  margin:0 0 8px;
}

.announcement p{
  color:#cbd5e1;
  white-space:pre-wrap;
  margin:0 0 12px;
}

.date{
  color:#7f8aa3;
  font-size:12px;
}

.delete{
  background:#ef4444;
  margin-top:12px;
}

.empty{
  color:#9299b5;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section class="login" id="loginPage">

  <div class="card">

    <div class="logo">R</div>

    <h1>RISE NETWORK</h1>

    <div class="sub">
      Admin Panel
    </div>

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter admin password"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <div id="message"></div>

  </div>

</section>


<!-- DASHBOARD -->
<section class="panel hidden" id="dashboard">

  <div class="topbar">

    <div>
      <h1>RISE ADMIN</h1>
      <div class="sub">
        Network Control Panel
      </div>
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>


  <div class="grid">

    <!-- CREATE ANNOUNCEMENT -->
    <div class="box">

      <h2>📢 Create Announcement</h2>

      <label>Title</label>

      <input
        id="announcementTitle"
        placeholder="Announcement title"
      >

      <label>Message</label>

      <textarea
        id="announcementMessage"
        placeholder="Write your announcement..."
      ></textarea>

      <button
        onclick="addAnnouncement()"
        style="margin-top:15px"
      >
        PUBLISH ANNOUNCEMENT
      </button>

    </div>


    <!-- ANNOUNCEMENTS -->
    <div class="box">

      <div
        style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        "
      >

        <h2>📢 Published Announcements</h2>

        <button onclick="loadAnnouncements()">
          REFRESH
        </button>

      </div>

      <div id="announcementList">
        <div class="empty">
          Loading...
        </div>
      </div>

    </div>

  </div>

</section>


<script>

let adminPassword = "";


/* =========================
   LOGIN
========================= */

async function login(){

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if(!password){

    message.textContent =
      "Enter your password.";

    return;
  }

  try{

    const response =
      await fetch(
        "/api/admin/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            password:password
          })
        }
      );

    const data =
      await response.json();

    if(data.success){

      adminPassword = password;

      document
        .getElementById("loginPage")
        .classList.add("hidden");

      document
        .getElementById("dashboard")
        .classList.remove("hidden");

      loadAnnouncements();

    }else{

      message.textContent =
        "Wrong password.";

    }

  }catch(error){

    message.textContent =
      "Connection error.";

  }

}


/* =========================
   LOAD ANNOUNCEMENTS
========================= */

async function loadAnnouncements(){

  const list =
    document.getElementById(
      "announcementList"
    );

  list.innerHTML =
    '<div class="empty">Loading...</div>';

  try{

    const response =
      await fetch(
        "/api/announcements"
      );

    const announcements =
      await response.json();

    if(
      !Array.isArray(announcements) ||
      announcements.length === 0
    ){

      list.innerHTML =
        '<div class="empty">No announcements yet.</div>';

      return;
    }

    list.innerHTML =
      announcements
      .map(item => `

        <div class="announcement">

          <h3>
            ${escapeHTML(item.title)}
          </h3>

          <p>
            ${escapeHTML(item.message)}
          </p>

          <div class="date">
            ${escapeHTML(item.created_at || "")}
          </div>

          <button
            class="delete"
            onclick="deleteAnnouncement(${item.id})"
          >
            DELETE
          </button>

        </div>

      `)
      .join("");

  }catch(error){

    list.innerHTML =
      '<div class="empty">Failed to load announcements.</div>';

  }

}


/* =========================
   ADD ANNOUNCEMENT
========================= */

async function addAnnouncement(){

  const title =
    document
      .getElementById(
        "announcementTitle"
      )
      .value
      .trim();

  const message =
    document
      .getElementById(
        "announcementMessage"
      )
      .value
      .trim();

  if(!title){

    alert("Enter announcement title.");

    return;
  }

  if(!message){

    alert("Enter announcement message.");

    return;
  }

  try{

    const response =
      await fetch(
        "/api/admin/announcements",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + adminPassword
          },

          body:JSON.stringify({
            title:title,
            message:message
          })
        }
      );

    const data =
      await response.json();

    if(data.success){

      document
        .getElementById(
          "announcementTitle"
        )
        .value = "";

      document
        .getElementById(
          "announcementMessage"
        )
        .value = "";

      loadAnnouncements();

      alert(
        "Announcement published!"
      );

    }else{

      alert(
        data.error ||
        "Failed to publish."
      );

    }

  }catch(error){

    alert(
      "Connection error."
    );

  }

}


/* =========================
   DELETE ANNOUNCEMENT
========================= */

async function deleteAnnouncement(id){

  if(
    !confirm(
      "Delete this announcement?"
    )
  ){

    return;
  }

  try{

    const response =
      await fetch(
        "/api/admin/announcements/" + id,
        {
          method:"DELETE",

          headers:{
            "Authorization":
              "Bearer " + adminPassword
          }
        }
      );

    const data =
      await response.json();

    if(data.success){

      loadAnnouncements();

    }else{

      alert(
        data.error ||
        "Failed to delete."
      );

    }

  }catch(error){

    alert(
      "Connection error."
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  adminPassword = "";

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("password")
    .value = "";

}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ENTER KEY */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        login();
      }

    }
  );

</script>

</body>
</html>
