<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISE NETWORK | Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #263477, #090d18 55%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: rgba(17, 24, 39, .96);
  border: 1px solid #303b58;
  border-radius: 24px;
  padding: 32px;
  box-shadow: 0 25px 70px #0009;
}

.logo {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  border-radius: 20px;
  background: linear-gradient(135deg,#5865f2,#7c5cff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  font-weight: 900;
}

h1 {
  text-align: center;
  margin: 0;
}

.subtitle {
  text-align: center;
  color: #9299b5;
  margin: 8px 0 30px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #cbd5e1;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #374151;
  background: #080b14;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #5865f2;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #5865f2;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#message {
  margin-top: 15px;
  text-align: center;
  color: #ff7b7b;
}

.dashboard {
  display: none;
}

.box {
  background: #090d18;
  border: 1px solid #29334a;
  border-radius: 14px;
  padding: 18px;
  margin-top: 12px;
}

.box span {
  color: #9ca3af;
  font-size: 14px;
}

.logout {
  background: #ef4444;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="card" id="loginCard">

  <div class="logo">R</div>

  <h1>RISE NETWORK</h1>

  <div class="subtitle">
    Secure Admin Panel
  </div>

  <label>Admin Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter password"
  >

  <button id="loginButton" onclick="login()">
    LOGIN
  </button>

  <div id="message"></div>

</div>


<!-- DASHBOARD -->

<div class="card dashboard" id="dashboard">

  <div class="logo">R</div>

  <h1>Admin Dashboard</h1>

  <div class="subtitle">
    Welcome to RISE NETWORK
  </div>

  <div class="box">
    <strong>🟢 System</strong><br>
    <span>Admin authentication successful.</span>
  </div>

  <div class="box">
    <strong>🌐 Website</strong><br>
    <span>RISE NETWORK is online.</span>
  </div>

  <div class="box">
    <strong>🗄️ Database</strong><br>
    <span>D1 database is connected.</span>
  </div>

  <button class="logout" onclick="logout()">
    LOGOUT
  </button>

</div>


<script>

async function login() {

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  message.textContent = "";

  if (!password) {
    message.textContent = "Enter your password.";
    return;
  }

  button.disabled = true;
  button.textContent = "CHECKING...";

  try {

    const response = await fetch(
      "/api/admin/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          password: password
        })
      }
    );

    const data = await response.json();

    if (data.success) {

      document.getElementById("loginCard")
        .style.display = "none";

      document.getElementById("dashboard")
        .style.display = "block";

    } else {

      message.textContent = "Wrong password.";

    }

  } catch (error) {

    message.textContent =
      "Connection error. Try again.";

  }

  button.disabled = false;
  button.textContent = "LOGIN";
}


function logout() {

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("loginCard")
    .style.display = "block";

  document.getElementById("password").value = "";

}

</script>

</body>
</html>
