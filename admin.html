<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RISE NETWORK — Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #080b14;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111827;
      border: 1px solid #29334a;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 60px #0008;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
    }

    h1 {
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-top: 8px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #080b14;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #5865f2;
    }

    .login {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    .dashboard {
      display: none;
    }

    .item {
      background: #080b14;
      border: 1px solid #29334a;
      border-radius: 13px;
      padding: 18px;
      margin-top: 12px;
    }

    .item span {
      color: #9ca3af;
      font-size: 14px;
    }

    .logout {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="card" id="loginCard">

    <div class="logo">R</div>

    <h1>RISE NETWORK</h1>

    <p class="subtitle">
      Secure Admin Panel
    </p>

    <label for="password">
      Admin Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
    >

    <button
      class="login"
      id="loginButton"
      onclick="login()"
    >
      LOGIN
    </button>

    <div id="status"></div>

  </div>


  <!-- DASHBOARD -->
  <div class="card dashboard" id="dashboard">

    <div class="logo">R</div>

    <h1>Admin Dashboard</h1>

    <p class="subtitle">
      Welcome to RISE NETWORK
    </p>

    <div class="item">
      <strong>🟢 Login Status</strong>
      <br>
      <span>Successfully authenticated</span>
    </div>

    <div class="item">
      <strong>🌐 Website</strong>
      <br>
      <span>RISE NETWORK is online</span>
    </div>

    <div class="item">
      <strong>🗄️ Database</strong>
      <br>
      <span>Cloudflare D1 connected</span>
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>


<script>

async function login() {

  const passwordInput =
    document.getElementById("password");

  const button =
    document.getElementById("loginButton");

  const status =
    document.getElementById("status");

  const password =
    passwordInput.value;

  if (!password) {
    status.style.display = "block";
    status.style.background = "#3b1f24";
    status.style.color = "#ff8b8b";
    status.textContent = "Enter your password.";
    return;
  }

  button.disabled = true;
  button.textContent = "CHECKING...";

  try {

    const response = await fetch(
      "/api/admin/login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          password: "Rise89"
        })
      }
    );

    const data = await response.json();

    /*
      TEMPORARY DEBUG

      This will show us exactly what
      the Worker is returning.
    */

    alert(JSON.stringify(data));

    if (data.secretFound === true) {

      status.style.display = "block";
      status.style.background = "#123322";
      status.style.color = "#72e6a0";
      status.textContent =
        "Worker can see ADMIN_PASSWORD.";

    } else {

      status.style.display = "block";
      status.style.background = "#3b1f24";
      status.style.color = "#ff8b8b";
      status.textContent =
        "Worker cannot see ADMIN_PASSWORD.";

    }

  } catch (error) {

    alert(
      "ERROR: " + error.message
    );

  }

  button.disabled = false;
  button.textContent = "LOGIN";
}


function logout() {

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("loginCard")
    .style.display = "block";

}

</script>

</body>
</html>
